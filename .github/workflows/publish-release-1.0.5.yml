name: Upload verified 1.0.5 release assets

# Upload the already signed artifacts; no signing key is needed by this job.
on:
  push:
    branches: [codex/ledger-ui-refresh]
    paths: [.github/workflows/publish-release-1.0.5.yml]

permissions:
  contents: write

concurrency:
  group: upload-release-1.0.5
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 628915eba21f5597e9a91b952571214ff1a7f193
          persist-credentials: false

      - name: Verify exact release files
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS-1.0.5.txt
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'renovation-ledger-1.0.5-signed.apk': '5a54dfd30fce9cd3a8df3eef075604f47841862b555fc3754319ecadd09cdee0',
              'renovation-ledger-1.0.5-source.zip': '1b8c5a6c77efdde51ce40031a424424f39eca5812db36ce4eee42a915f730307',
          }
          for name, digest in expected.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'Unexpected release content: {name}')
          PY

      - name: Upload missing assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/{repo}/releases/448332398',
          ]))
          if release['tag_name'] != 'v1.0.5':
              raise SystemExit('Unexpected release tag')
          if release['target_commitish'] != '628915eba21f5597e9a91b952571214ff1a7f193':
              raise SystemExit('Unexpected release source commit')
          existing = {asset['name']: asset for asset in release['assets']}
          names = ['renovation-ledger-1.0.5-signed.apk', 'renovation-ledger-1.0.5-source.zip', 'SHA256SUMS-1.0.5.txt']
          for name in names:
              file = Path('dist') / name
              digest = 'sha256:' + hashlib.sha256(file.read_bytes()).hexdigest()
              if name in existing:
                  asset = existing[name]
                  if asset.get('digest') != digest or asset['size'] != file.stat().st_size:
                      raise SystemExit(f'Existing asset differs: {name}')
                  print(f'Already uploaded and verified: {name}', flush=True)
                  continue
              if not release['draft']:
                  raise SystemExit('Refusing to add files to a release that is already published')
              subprocess.run(['gh', 'release', 'upload', 'v1.0.5', str(file), '--repo', repo], check=True)
          PY
